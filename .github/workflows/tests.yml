name: tests

on:
  push:
  pull_request:

jobs:
  linux:
    name: Linux, Python ${{ matrix.python }} (software rendering, OSMesa)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    env:
      MUJOCO_GL: osmesa            # no GPU on the runners: Mesa's software OpenGL
      PYOPENGL_PLATFORM: osmesa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: System libraries for headless rendering
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libosmesa6-dev
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Example (random agents, rendered)
        run: python examples/random_agents.py --episodes 1 --max-steps 100
      - name: Tests
        run: python -m pytest -q
